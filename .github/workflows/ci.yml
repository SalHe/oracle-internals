name: ci
on:
  push:
  workflow_dispatch:

jobs:
  redo-collect:
    name: Oracle Redo Collecting
    runs-on: ubuntu-latest
    strategy:
      matrix:
        db-version: ["19c-ee", "21c-ee"]

    steps:
      - uses: actions/checkout@v5

      # !!!Image is too large to cache. Actually, create database is the key for time cost.
      # !!! Error: Error: Command failed: docker save --output ~/.docker-images.tar limslee/oracle-database:21c-ee
      # !!! Error response from daemon: write /var/lib/docker/tmp/docker-export-3825420/blobs/sha256/d3973aa29bed4f2e8ab0adb1c890059190e345a741e27e2b4a51064b5e31f8c1: no space left on device
      # - name: Cache Docker images.
      #   uses: ScribeMD/docker-cache@0.5.0
      #   with:
      #     key: docker-${{ runner.os }}-${{ hashFiles("oracle-internal-ci-" + ${{ matrix.db-version }} + ".yaml") }}

      - name: Pull Oracle Database Image
        run: |
          docker pull `grep -oP 'image: \K.*?$' oracle-internal-ci-${{ matrix.db-version }}.yaml`

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install the project
        run: uv sync --locked --all-extras --dev

      - name: Initialize the container
        run: docker images && uv run ./main.py --config oracle-internal-ci-${{ matrix.db-version }}.yaml init

      - name: Collecting Redo
        run: uv run ./main.py --config oracle-internal-ci-${{ matrix.db-version }}.yaml collect -- -v

      - name: Upload Report
        uses: actions/upload-artifact@v4
        with:
          name: oracle-redo-cases-${{ matrix.db-version }}
          path: ./out
